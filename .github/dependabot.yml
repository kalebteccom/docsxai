version: 2

# Per ci-and-bot-threats.md §2.1:
#   - Weekly schedule (axios + Kong 2024 pattern: malicious dep ships, every
#     instant-merging adopter eats it within 5 minutes).
#   - Group dev-deps patches into a single PR.
#   - Ignore semver-major across the board. Every major bump is a human
#     review, since security regressions tend to ride along on major upgrades.
#   - No github-actions ecosystem: no GitHub Actions workflow remains.
#     Nothing auto-merges; every Dependabot PR is human-reviewed.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-deps-patch:
        dependency-type: development
        update-types:
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
