name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck resolves cross-package imports (@docsxai/engine, @docsxai/viewer)
      # through each package's built dist/, so build runs first.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      # Keystone suites drive real Chromium; this exact install command is the
      # documented allowed exception to the no-install-scripts posture.
      - run: pnpm -C packages/engine exec playwright-core install chromium
      - run: pnpm -r test
