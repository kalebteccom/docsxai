<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Obstacles page</title>
    <style>
      body {
        margin: 0;
        font: 16px/20px sans-serif;
      }
      #share {
        position: absolute;
        left: 300px;
        top: 200px;
        width: 100px;
        height: 30px;
      }
      #notes {
        position: absolute;
        left: 20px;
        top: 200px;
        width: 260px;
        margin: 0;
      }
      #above {
        position: absolute;
        left: 300px;
        top: 150px;
        width: 320px;
        margin: 0;
      }
      #below {
        position: absolute;
        left: 300px;
        top: 245px;
        width: 320px;
        margin: 0;
      }
      #help {
        position: absolute;
        left: 430px;
        top: 205px;
      }
      #draft {
        display: none;
        position: absolute;
        left: 20px;
        top: 320px;
      }
      #footer {
        position: absolute;
        left: 880px;
        top: 650px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <button id="share">Share <span>now</span></button>
    <p id="notes">Notes sit to the left of the Share button and wrap onto a second line.</p>
    <p id="above">Plan the page, then check the text above the button.</p>
    <p id="below">Everything under the button is text as well.</p>
    <a id="help" href="#help">Help center</a>
    <p id="draft">A draft that is not shown</p>
    <p id="footer">Footer text</p>
  </body>
</html>
