name: desktop-1280
environment:
  clock: 2026-01-15T10:00:00Z
  locale: en-US
  timezone: UTC
  viewport:
    width: 1280
    height: 800
  color_scheme: dark
  reduced_motion: true
locators:
  page_title: h1.page__title
  view_tabs: nav.etabs
  col_progress: section.column[aria-label="In progress"]
  col_progress_head: section.column[aria-label="In progress"] h2.column__heading
  tab_backlog: nav.etabs a:has-text("Backlog")
  ticket_title: h2.tread__title
  ticket_status: button.tpill[aria-label^="Status:"]
  ticket_gaps: section[aria-labelledby="gaps-heading"]
  first_gap_slot: button.rowgap__slot >> nth=0
  palette: div[role="dialog"][aria-label="Search and commands"]
  palette_input: input.palette__input
  dev_badge: nextjs-portal [data-next-badge]
  loopback_text: ':text-matches("127[.]0[.]0[.]1|localhost", "i"), input[placeholder*="127.0.0.1" i], input[placeholder*="localhost" i], input[value*="127.0.0.1" i], input[value*="localhost" i] >> visible=true >> nth=0'
  palette_list: div[role="listbox"][aria-label="Results"]
  list_gap_btn: button.row__gapsbtn >> nth=0
  filters: div.filters[role="group"]
  group_toggle: button.grp__toggle >> nth=0
  group_progress: span.grp__extras >> nth=0
  col_head: div.lhead
  epics_display: div.qbar[aria-label="Display"]
  epic_row_first: a.erow >> nth=0
  epic_progress_first: span.eprogress >> nth=0
  epic_holders_first: span.erow__holders >> nth=0
  epic_status: button.pill[aria-label^="Status:"]
  epic_add_task: button.chip:has-text("Add task")
  epic_milestone: button.mstone__head >> nth=0
  progress_bar: div.lsum__bar
  progress_row_first: nav.llist a.ledrow >> nth=0
  progress_card: li.lcard >> nth=0
  docs_title: h1.dindex__title
  docs_scopes: nav.dindex__scopes
  docs_table: table.dtable
  doc_belongs: dl.dread__props dd >> nth=0
  doc_outline_link: a.doutline__link >> nth=0
  doc_title: .live__field[aria-label^="Document title"]
  mine_tabs: nav.etabs[aria-label="Mine"]
  settings_key_input: form.invite input >> nth=0
  settings_rename_key: button.lrow__act >> nth=0
  settings_conventions: "#conventions-heading"
  tokens_config: section[aria-labelledby="connect-heading"] pre
  tokens_config_text: section[aria-labelledby="connect-heading"] pre code
  tokens_copy: section[aria-labelledby="connect-heading"] button.button--quiet
  tokens_form_input: form.pane__section input >> nth=0
  tokens_table_head: table.table th >> nth=0
  tokens_agent_cell: table.table td >> nth=1
  connect_pick_first: span.connect__client >> nth=0
  connect_card: section.connect__card
  connect_url: div.connect__copy
  connect_url_text: div.connect__copy pre
steps:
  - id: board-open
    action: navigate
    value: /w/acme-demo/board
    wait_for:
      selector: $col_progress
  - id: board-idle
    action: wait
    wait_for: network_idle
  - id: board-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: board-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: board
    action: wait
    target: $page_title
    wait_for: element_stable
    annotations:
      - target: $page_title
        copy: The board shows every task as a card, grouped by status.
        arrow: right
      - target: $view_tabs
        copy: Switch between the board, the backlog and the full list.
        arrow: bottom
      - target: $col_progress_head
        copy: Tasks an agent is working on right now sit in In progress.
        arrow: top
  - id: palette-open
    action: press
    value: /
    wait_for:
      selector: $palette_input
    success:
      visible: $palette
  - id: palette-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: palette-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: palette
    action: wait
    target: $palette_input
    wait_for: element_stable
    annotations:
      - target: $palette_input
        copy: Press / or Cmd+K on any page to search or run a command.
        arrow: bottom
      - target: $palette_list
        copy: Results mix tasks, epics, people and commands.
        arrow: top
  - id: palette-close
    action: press
    value: Escape
    success:
      hidden: $palette
  - id: ticket-open
    action: navigate
    value: /w/acme-demo/t/WEB-8
    wait_for:
      selector: $ticket_title
  - id: ticket-idle
    action: wait
    wait_for: network_idle
  - id: ticket-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: ticket-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: ticket
    action: wait
    target: $ticket_title
    wait_for: element_stable
    annotations:
      - target: $ticket_title
        copy: A task keeps its title, address and description in one place.
        arrow: right
      - target: $ticket_status
        copy: The status pill shows where the task stands.
        arrow: top
      - target: $ticket_gaps
        copy: A gap is a question an agent raised. Answer it here to unblock the work.
        arrow: top
  - id: waiting-open
    action: navigate
    value: /w/acme-demo?attention=waiting
    wait_for:
      selector: $first_gap_slot
  - id: waiting-idle
    action: wait
    wait_for: network_idle
  - id: waiting-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: waiting-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: waiting
    action: wait
    target: $page_title
    wait_for: element_stable
    success:
      visible: $first_gap_slot
    annotations:
      - target: $page_title
        copy: Waiting on you lists the tasks blocked on your answer.
        arrow: right
      - target: $first_gap_slot
        copy: Answer an open gap on a row without leaving the list.
        arrow: top
  - id: list-open
    action: navigate
    value: /w/acme-demo
    wait_for:
      selector: $list_gap_btn
  - id: list-idle
    action: wait
    wait_for: network_idle
  - id: list-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: list-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: list
    action: wait
    target: $page_title
    wait_for: element_stable
    annotations:
      - target: $filters
        copy: Filter the list, or add a filter on any field.
        arrow: bottom
      - target: $col_head
        copy: Columns show gaps, epic, criteria and estimate for every task.
        arrow: top
      - target: $list_gap_btn
        copy: A gap count means an agent is waiting on you. Open it to answer.
        arrow: left
  - id: backlog-open
    action: navigate
    value: /w/acme-demo?attention=backlog
    wait_for:
      selector: $group_toggle
  - id: backlog-idle
    action: wait
    wait_for: network_idle
  - id: backlog-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: backlog-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: backlog
    action: wait
    target: $page_title
    wait_for: element_stable
    annotations:
      - target: $tab_backlog
        copy: The backlog holds open tasks that nobody has claimed yet.
        arrow: top
      - target: $group_progress
        copy: Each group shows how far its epic has come.
        arrow: bottom
  - id: epics-open
    action: navigate
    value: /w/acme-demo/epics
    wait_for:
      selector: $epic_row_first
  - id: epics-idle
    action: wait
    wait_for: network_idle
  - id: epics-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: epics-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: epics
    action: wait
    target: $page_title
    wait_for: element_stable
    annotations:
      - target: $epics_display
        copy: Change how epics are grouped and sorted.
        arrow: bottom
      - target: $epic_progress_first
        copy: The bar counts tasks done and tasks in progress.
        arrow: top
      - target: $epic_holders_first
        copy: Avatars show who holds the epic's work, people and agents.
        arrow: bottom
  - id: epic-open
    action: navigate
    value: /w/acme-demo/epics/checkout-redesign-WEB-E1
    wait_for:
      selector: $epic_status
  - id: epic-idle
    action: wait
    wait_for: network_idle
  - id: epic-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: epic-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: epic
    action: wait
    target: $epic_status
    wait_for: element_stable
    annotations:
      - target: $epic_add_task
        copy: Add a task to this epic from here.
        arrow: bottom
      - target: $epic_status
        copy: Set the status, priority, lead and target date under the title.
        arrow: right
      - target: $epic_milestone
        copy: Milestones split the epic into dated checkpoints.
        arrow: top
  - id: progress-open
    action: navigate
    value: /w/acme-demo/progress
    wait_for:
      selector: $progress_bar
  - id: progress-idle
    action: wait
    wait_for: network_idle
  - id: progress-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: progress-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: progress
    action: wait
    target: $page_title
    wait_for: element_stable
    annotations:
      - target: $progress_bar
        copy: "The bar splits every task by phase: done, in progress, waiting, claimed or open."
        arrow: bottom
      - target: $progress_row_first
        copy: Open tasks group by epic. Select one to read it on the right.
        arrow: right
      - target: $progress_card
        copy: A question waiting on you shows up in the task's timeline.
        arrow: left
  - id: documents-open
    action: navigate
    value: /w/acme-demo/documents
    wait_for:
      selector: $docs_table
  - id: documents-idle
    action: wait
    wait_for: network_idle
  - id: documents-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: documents-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: documents
    action: wait
    target: $docs_title
    wait_for: element_stable
    annotations:
      - target: $docs_scopes
        copy: "Filter documents by what owns them: the workspace, an epic, a team or a project."
        arrow: bottom
      - target: $docs_table
        copy: Open a document to read it. Each one shows its version.
        arrow: top
  - id: document-open
    action: navigate
    value: /w/acme-demo/documents/0000000000013d5d45df0000ab
    wait_for:
      selector: $doc_title
  - id: document-idle
    action: wait
    wait_for: network_idle
  - id: document-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: document-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: document
    action: wait
    target: $doc_title
    wait_for: element_stable
    annotations:
      - target: $doc_belongs
        copy: A document belongs to the workspace, an epic, a team or a project.
        arrow: right
      - target: $doc_outline_link
        copy: Contents lists the headings. Click one to jump to it.
        arrow: left
      - target: $doc_title
        copy: Click the title or body to edit. It saves when you stop typing.
        arrow: bottom
  - id: mine-open
    action: navigate
    value: /w/acme-demo/mine?tab=leading
    wait_for:
      selector: $epic_row_first
  - id: mine-idle
    action: wait
    wait_for: network_idle
  - id: mine-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: mine-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: mine
    action: wait
    target: $page_title
    wait_for: element_stable
    annotations:
      - target: $mine_tabs
        copy: Claimed is what you hold, Reported what you filed, Leading the epics you lead.
        arrow: bottom
      - target: $epic_row_first
        copy: Each epic you lead shows its progress and who holds the work.
        arrow: top
  - id: settings-open
    action: navigate
    value: /w/acme-demo/settings
    wait_for:
      selector: $settings_key_input
  - id: settings-idle
    action: wait
    wait_for: network_idle
  - id: settings-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: settings-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: settings
    action: wait
    target: $page_title
    wait_for: element_stable
    annotations:
      - target: $settings_key_input
        copy: The workspace key prefixes every task number, such as ACME-142.
        arrow: right
      - target: $settings_rename_key
        copy: Rename a project key. The old one keeps opening its tasks.
        arrow: left
      - target: $settings_conventions
        copy: Agents read the conventions document first. Pick which one it is.
        arrow: right
  - id: agent-tokens-open
    action: navigate
    value: /w/acme-demo/tokens
    wait_for:
      selector: $tokens_config
  - id: agent-tokens-idle
    action: wait
    wait_for: network_idle
  - id: agent-tokens-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: agent-tokens-hide-url
    action: hide
    target: $tokens_config_text
    timeout_ms: 5000
  - id: agent-tokens-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: agent-tokens
    action: wait
    target: $page_title
    wait_for: element_stable
    annotations:
      - target: $tokens_config
        copy: Your agent's MCP install snippet lives here.
        arrow: left
      - target: $tokens_copy
        copy: Copy the whole block in one click.
        arrow: right
  - id: agent-tokens-show-url
    action: show
    target: $tokens_config_text
  - id: agent-tokens-issued-open
    action: navigate
    value: /w/acme-demo/tokens
    wait_for:
      selector: $tokens_table_head
  - id: agent-tokens-issued-idle
    action: wait
    wait_for: network_idle
  - id: agent-tokens-issued-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: agent-tokens-issued-scroll
    action: hover
    target: $tokens_table_head
    wait_for: element_stable
  - id: agent-tokens-issued-hide-url
    action: hide
    target: $tokens_config_text
    timeout_ms: 5000
  - id: agent-tokens-issued-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: agent-tokens-issued
    action: wait
    target: $tokens_table_head
    wait_for: element_stable
    annotations:
      - target: $tokens_form_input
        copy: Name a token for one agent session, then issue it.
        arrow: right
      - target: $tokens_agent_cell
        copy: Each token belongs to one agent, so every write says which agent made it.
        arrow: top
  - id: agent-tokens-issued-show-url
    action: show
    target: $tokens_config_text
  - id: connect-open
    action: navigate
    value: /w/acme-demo/connect
    wait_for:
      selector: $connect_url
  - id: connect-idle
    action: wait
    wait_for: network_idle
  - id: connect-no-dev-overlay
    action: wait
    success:
      hidden: $dev_badge
  - id: connect-hide-url
    action: hide
    target: $connect_url_text
    timeout_ms: 5000
  - id: connect-no-loopback
    action: wait
    success:
      hidden: $loopback_text
  - id: connect
    action: wait
    target: $page_title
    wait_for: element_stable
    success:
      visible: $connect_url
    annotations:
      - target: $connect_pick_first
        copy: Pick the app you want to connect.
        arrow: right
      - target: $connect_card
        copy: Follow the steps for that app. An agent never needs to see your token.
        arrow: right
      - target: $connect_url
        copy: Copy the connector URL from here when the app asks for one.
        arrow: top
  - id: connect-show-url
    action: show
    target: $connect_url_text
    success:
      visible: $connect_url
